name: CI/CD Patito Online Judge

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - patito2-0

  pull_request:
    branches:
      - patito2-0

  workflow_dispatch:
    inputs:
      tags:
        description: '@contest'
        required: false
        default: ''

      env:
        description: 'application.properties'
        required: false
        default: 'dev'

      reset_db:
        description: 'Ejecuta scripts/reset-test-db.sh --yes antes de cada test'
        required: false
        type: boolean
        default: true

      run_selenium:
        description: 'Ejecutar pruebas Selenium antes de publicar la imagen'
        required: false
        type: boolean
        default: false

      keep_image_versions:
        description: 'Cantidad de versiones Docker a conservar en GHCR'
        required: false
        default: '6'

concurrency:
  group: patito-client-web-patito2-0
  cancel-in-progress: false

jobs:
    env:
      IMAGE_NAME: ghcr.io/onlinejudgebo/patito-client-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:patito2-0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    name: Cleanup old Docker images
    runs-on: self-hosted

    needs:
      - publish-image

    if: >-
      ${{
        success() &&
        github.event_name != 'pull_request'
      }}

    continue-on-error: true

    steps:
      - name: Keep only recent GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: patito-client-web
          package-type: container
          min-versions-to-keep: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_image_versions || '6' }}
