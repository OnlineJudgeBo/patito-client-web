name: CI/CD Patito Online Judge

permissions:
  contents: read
  packages: write

"on":
  push:
    branches:
      - patito2-0
  pull_request:
    branches:
      - patito2-0
  workflow_dispatch:
    inputs:
      tags:
        description: '@contest'
        required: false
        default: ''
      env:
        description: 'application.properties'
        required: false
        default: 'dev'
      reset_db:
        description: 'Ejecuta scripts/reset-test-db.sh --yes antes de cada test'
        required: false
        type: boolean
        default: true
      keep_image_versions:
        description: 'Cantidad de versiones Docker a conservar en GHCR'
        required: false
        default: '3'

jobs:
  deploy-patito:
    name: Deploy local Docker Compose stack
    runs-on: self-hosted
    if: github.ref == 'refs/heads/patito2-0'
    steps:
      - name: Pull latest code and restart stack
        run: |
          set -euo pipefail
          cd /home/github-runner/patito/patito-client-web
          git pull --ff-only
          cd ..
          docker compose down
          docker compose up -d --build
          docker compose ps

  run-automation-tests:
    name: Trigger Selenium BDD tests (patito-automation-test)
    runs-on: self-hosted
    needs:
      - deploy-patito
    if: ${{ success() && github.event_name != 'pull_request' }}
    steps:
      - name: Trigger and wait for BDD tests in patito-automation-test
        env:
          GH_TOKEN: ${{ secrets.PATITO_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE="selenium-tests.yml"
          ENV_NAME="${{ github.event.inputs.env || 'dev' }}"
          TAGS="${{ github.event.inputs.tags || '' }}"
          RESET_DB="${{ github.event.inputs.reset_db || 'true' }}"
          MARKER="ci-${{ github.run_id }}-${{ github.run_attempt }}"

          echo "Disparando $WORKFLOW_FILE con marker: $MARKER"
          gh workflow run "$WORKFLOW_FILE" \
            --repo OnlineJudgeBo/patito-automation-test \
            --ref main \
            -f env="$ENV_NAME" \
            -f tags="$TAGS" \
            -f reset_db="$RESET_DB" \
            -f run_marker="$MARKER"

          echo "Buscando el run_id correspondiente..."
          RUN_ID=""
          for i in $(seq 1 15); do
            RUN_ID=$(gh run list \
              --repo OnlineJudgeBo/patito-automation-test \
              --workflow "$WORKFLOW_FILE" \
              --limit 10 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$MARKER\")) | .databaseId" | head -1)

            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "Intento $i: aún no aparece, reintentando en 3s..."
            sleep 3
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No se pudo encontrar el run disparado con marker $MARKER"
            exit 1
          fi

          echo "Run ID encontrado: $RUN_ID"
          echo "Ver en: https://github.com/OnlineJudgeBo/patito-automation-test/actions/runs/$RUN_ID"

          gh run watch "$RUN_ID" \
            --repo OnlineJudgeBo/patito-automation-test \
            --exit-status

  publish-image:
    name: Publish Docker image after tests
    runs-on: self-hosted
    needs: run-automation-tests
    if: ${{ success() && github.event_name != 'pull_request' }}
    env:
      IMAGE_NAME: ghcr.io/onlinejudgebo/patito-client-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    name: Cleanup old Docker images
    runs-on: self-hosted
    needs: publish-image
    if: ${{ success() && github.event_name != 'pull_request' }}
    continue-on-error: true
    steps:
      - name: Keep only recent GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: patito-client-web
          package-type: container
          min-versions-to-keep: ${{ github.event.inputs.keep_image_versions || '3' }}
          ignore-versions: '^(${{ github.sha }}|${{ github.ref_name }})$'

      - name: Delete untagged GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: patito-client-web
          package-type: container
          min-versions-to-keep: '0'
          delete-only-untagged-versions: 'true'
