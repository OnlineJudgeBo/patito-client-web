name: CI/CD Patito Online Judge

permissions:
  contents: read
  packages: write

"on":
  push:
    branches:
      - patito2-0
  pull_request:
    branches:
      - patito2-0
  workflow_dispatch:
    inputs:
      tags:
        description: '@contest'
        required: false
        default: ''
      env:
        description: 'application.properties'
        required: false
        default: 'dev'
      reset_db:
        description: 'Ejecuta scripts/reset-test-db.sh --yes antes de cada test'
        required: false
        type: boolean
        default: true
      keep_image_versions:
        description: 'Cantidad de versiones Docker a conservar en GHCR'
        required: false
        default: '3'

jobs:
  deploy-patito:
    name: Deploy local Docker Compose stack
    runs-on: self-hosted
    if: github.ref == 'refs/heads/patito2-0'
    steps:
      - name: Pull latest code and restart stack
        run: |
          set -euo pipefail
          cd /home/sloza/patito/patito-client-web
          git pull --ff-only
          cd ..
          docker compose down
          docker compose up -d --build
          docker compose ps

  run-automation-tests:
    name: Run Selenium BDD tests
    runs-on: self-hosted
    needs:
      - deploy-patito
    if: ${{ success() && github.event_name != 'pull_request' }}
    env:
      ENV_NAME: ${{ github.event.inputs.env || 'dev' }}
      TAGS: ${{ github.event.inputs.tags || '' }}
      RESET_DB: ${{ github.event.inputs.reset_db || 'true' }}
      HEADLESS: 'true'
    steps:
      - name: Checkout automation tests repository
        uses: actions/checkout@v4
        with:
          repository: OnlineJudgeBo/patito-automation-test
          ref: main
          token: ${{ secrets.PATITO_AUTOMATION_TOKEN }}
          path: patito-automation-test

      - name: Ensure scripts are executable
        working-directory: patito-automation-test
        run: |
          chmod +x ./gradlew
          chmod +x scripts/reset-test-db.sh

      - name: Reset test database
        if: env.RESET_DB == 'true'
        working-directory: patito-automation-test
        run: scripts/reset-test-db.sh --yes

      - name: Run BDD tests
        working-directory: patito-automation-test
        run: |
          set -euo pipefail
          if [ -n "$TAGS" ]; then
            ./gradlew clean executeBDDTests --no-daemon -Denv="$ENV_NAME" -Dheadless="$HEADLESS" -Dtags="$TAGS"
          else
            ./gradlew clean executeBDDTests --no-daemon -Denv="$ENV_NAME" -Dheadless="$HEADLESS"
          fi

  publish-image:
    name: Publish Docker image after tests
    runs-on: self-hosted
    needs: run-automation-tests
    if: ${{ success() && github.event_name != 'pull_request' }}
    env:
      IMAGE_NAME: ghcr.io/onlinejudgebo/patito-client-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    name: Cleanup old Docker images
    runs-on: self-hosted
    needs: publish-image
    if: ${{ success() && github.event_name != 'pull_request' }}
    continue-on-error: true
    steps:
      - name: Keep only recent GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: patito-client-web
          package-type: container
          min-versions-to-keep: ${{ github.event.inputs.keep_image_versions || '3' }}
          ignore-versions: '^(${{ github.sha }}|${{ github.ref_name }})$'

      - name: Delete untagged GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: patito-client-web
          package-type: container
          min-versions-to-keep: '0'
          delete-only-untagged-versions: 'true'
