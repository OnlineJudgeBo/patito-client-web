<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/client-web/public

    RedirectMatch 302 ^/$ /oj/

    Alias /oj /var/www/html/client-web/public
    <Directory /var/www/html/client-web/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /oj/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /oj/index.php [QSA,L]
    </Directory>
</VirtualHost>
