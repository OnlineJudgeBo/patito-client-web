server {
    listen 80;
    server_name _;

    root /var/www/html/client-web/public;
    index index.php index.html;

    client_max_body_size 64m;

    # Behind Traefik (Docker network) REMOTE_ADDR is the proxy; Traefik replaces X-Forwarded-For with the
    # real client IP, so trust that header only when it comes from the Docker network.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    absolute_redirect off;

    location = / {
        return 302 /oj/;
    }

    location ~ ^/([^/]+\.php)$ {
        return 302 /oj$request_uri;
    }

    location /oj/ {
        alias /var/www/html/client-web/public/;
        try_files $uri $uri/ /oj/index.php?$query_string;
    }

    location ~ ^/oj/(.+\.php)$ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/client-web/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/client-web/public;
        fastcgi_param SCRIPT_NAME /oj/index.php;
    }

    location ~ /\. {
        deny all;
    }
}
