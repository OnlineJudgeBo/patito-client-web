server {
    listen 80;
    server_name _;

    root /var/www/html/client-web/public;
    index index.php index.html;

    client_max_body_size 64m;
    absolute_redirect off;

    location = / {
        return 302 /oj/;
    }

    location /oj/ {
        alias /var/www/html/client-web/public/;
        try_files $uri $uri/ /oj/index.php?$query_string;
    }

    # Legacy URLs such as /oj/login.php are handled by public/index.php.
    # The real route files live under public/Routing, so do not ask PHP-FPM
    # to execute non-existent public/*.php files.
    location ~ ^/oj/(.+\.php)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/client-web/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/client-web/public;
        fastcgi_param SCRIPT_NAME /oj/index.php;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ /\. {
        deny all;
    }
}
